name: Release Oxee

# Builds Oxee for Android and iOS on GitHub's runners, so no Mac is needed.
#
#   * Push an annotated tag `oxee-v<version>` to release: APKs go to a GitHub
#     release (the tag message is its body), the iOS build is uploaded to
#     App Store Connect / TestFlight.
#   * Run it by hand ("Run workflow") for a test build: artifacts only,
#     nothing is published unless `publish` is ticked.
#
# Without signing secrets the jobs still build (Android with a throwaway key,
# iOS unsigned), which proves the code compiles on both platforms. The secrets
# are described in brand/README.md, "Releasing".

on:
  push:
    tags:
      - 'oxee-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.0'
        required: true
      publish:
        description: 'Upload iOS to TestFlight and create the GitHub release'
        type: boolean
        default: false

concurrency:
  group: release-oxee-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#oxee-v}"
            publish=true
          else
            version="$INPUT_VERSION"
            publish="$INPUT_PUBLISH"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 1.2.3, got '$version'"; exit 1
          fi
          # Store build numbers must only go up: derive one from the run.
          build=$(( 1000 + GITHUB_RUN_NUMBER ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Oxee $version ($build), publish=$publish"

  android:
    name: Android
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Only the submodules the app builds from. openwebui-src and hermes-src
      # are API references and took most of the job's time to clone.
      - run: git submodule update --init --depth 1 third_party/mermaid third_party/katex
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: python3 brand/tools/check_brand.py
      - run: flutter pub get
      - name: Generate code
        shell: bash
        run: |
          for dir in . packages/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              (cd "$dir" && dart run build_runner build)
            fi
          done
      - name: Signing key
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.OXEE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OXEE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OXEE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OXEE_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/oxee-upload.jks
          else
            echo "::warning::No OXEE_ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key (test build only, not installable over a store build)."
            KEYSTORE_PASSWORD=throwaway KEY_PASSWORD=throwaway KEY_ALIAS=oxee
            keytool -genkeypair -keystore app/oxee-upload.jks -alias oxee -keyalg RSA -keysize 2048 \
              -validity 30 -storepass throwaway -keypass throwaway -dname "CN=Oxee test build"
          fi
          {
            echo "storeFile=oxee-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 \
            --build-name="$VERSION" --build-number="$BUILD"
          flutter build appbundle --release --target-platform android-arm,android-arm64 \
            --build-name="$VERSION" --build-number="$BUILD"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Oxee-$VERSION-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/Oxee-$VERSION-armv7.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/Oxee-$VERSION.aab"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: oxee-android
          path: dist/*

  ios:
    name: iOS
    needs: prepare
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.OXEE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.OXEE_ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.OXEE_ASC_KEY_P8 }}
      IOS_DIST_P12: ${{ secrets.OXEE_IOS_DIST_P12 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.OXEE_IOS_DIST_P12_PASSWORD }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/ios/Flutter/ArmOnly.xcconfig
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Only the submodules the app builds from. openwebui-src and hermes-src
      # are API references and took most of the job's time to clone.
      - run: git submodule update --init --depth 1 third_party/mermaid third_party/katex
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: python3 brand/tools/check_brand.py
      - name: Apple team
        # Public (it is in every signed app), so it lives in brand/brand.json.
        run: echo "APPLE_TEAM_ID=$(python3 -c 'import json; print(json.load(open("brand/brand.json"))["appleTeamId"])')" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Generate code
        shell: bash
        run: |
          for dir in . packages/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              (cd "$dir" && dart run build_runner build)
            fi
          done
      - name: CocoaPods
        run: cd ios && pod install
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$BUILD"
      # App Store (distribution) signing only: no registered iPhone needed.
      # brand/tools/ios_signing.py explains each step.
      - name: Signing
        id: signing
        if: env.ASC_KEY_P8 != '' && env.IOS_DIST_P12 != ''
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]" requests
          "$RUNNER_TEMP/venv/bin/python" brand/tools/ios_signing.py "$RUNNER_TEMP/signing"
      - name: Archive and export
        if: steps.signing.outcome == 'success'
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Oxee.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Oxee.xcarchive" \
            -exportOptionsPlist "$IPA_EXPORT_OPTIONS" -exportPath "$RUNNER_TEMP/export"
          mkdir -p dist
          cp "$RUNNER_TEMP"/export/*.ipa "dist/Oxee-$VERSION.ipa"
          ls -l dist
      - name: Upload to TestFlight
        if: steps.signing.outcome == 'success' && env.PUBLISH == 'true'
        run: |
          id=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          issuer=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_$id.p8
          xcrun altool --upload-app -f "dist/Oxee-$VERSION.ipa" -t ios --apiKey "$id" --apiIssuer "$issuer"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_$id.p8
      - name: Remove signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true
      - name: Package unsigned build
        if: env.ASC_KEY_P8 == '' || env.IOS_DIST_P12 == ''
        run: |
          echo "::warning::No App Store Connect key or distribution certificate: unsigned build only (it proves the app compiles; it cannot be installed)."
          app=$(ls -d build/ios/iphoneos/Runner.app build/ios/Release-iphoneos/Runner.app 2>/dev/null | head -1)
          [ -n "$app" ] || { echo "::error::Runner.app not found"; exit 1; }
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/
          (cd dist && zip -qr "Oxee-$VERSION-unsigned.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: oxee-ios
          path: dist/*

  github-release:
    name: GitHub release
    needs: [prepare, android, ios]
    if: needs.prepare.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/oxee-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: oxee-android
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Oxee $VERSION" --notes-file notes.md --latest \
            dist/*.apk
